name: CI Validar y Testear

on:
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: prac1cicd/package-lock.json

      - name: Instalar dependencias
        working-directory: ./prac1cicd
        run: npm ci

      - name: Validar HTML (html-validate)
        working-directory: ./prac1cicd
        run: npx html-validate index.html