name: CI Validar y Testear

on:
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./prac1cid

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./prac1cid/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Validar HTML
        run: npx html-validate index.html
