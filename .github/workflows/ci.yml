name: CI Validar y Testear

on:
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Comprobar estructura
        run: |
          pwd
          ls -la
          ls -la prac1cid

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prac1cid/package-lock.json

      - name: Instalar dependencias
        working-directory: ./prac1cid
        run: npm ci

      - name: Validar HTML
        working-directory: ./prac1cid
        run: npx html-validate index.html